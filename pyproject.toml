[build-system]
build-backend = "uv_build"
requires = [
  "uv-build>=0.13.6,<0.14",
]

[project]
name = "dbeaver-portable"
version = "0.1.0"
description = "Build a no-admin DBeaver Community package for Windows: plugins, drivers, defaults and an installer"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ivan Donisete Lonel", email = "ivanlonel91@gmail.com" },
]
requires-python = ">=3.15"
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
]
dependencies = [
  "defusedxml~=0.7.1",
]
urls.Repository = "https://github.com/ivanlonel/dbeaver-portable"
scripts.dbeaver-portable = "dbeaver_portable.cli:main"

[dependency-groups]
dev = [
  "deptry~=0.25.1",
  "prek~=0.5.9",
  "pylint~=4.1.3",
  "ruff~=0.17.3",
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "pytest~=9.2.0",
  "pytest-cov~=7.1.0",
]
type = [
  "mypy[faster-cache]~=2.4.1",
  "ty~=0.0.95",
  "types-defusedxml~=0.7.0",
]
# Packages that are not installed in the local environment but run as pre-commit hooks. Listing them
# here keeps their versions controlled by uv.lock and synchronized into .pre-commit-config.yaml by
# sync-with-uv, since `prek autoupdate` ignores interpreter version constraints.
hook = [
  "mdformat~=1.0.0",
  "mdformat-gfm~=1.0.0",
  "mdformat-ruff~=0.1.3",
  "pre-commit-hooks~=6.0.0",
  "pyproject-fmt~=2.30.3",
  "sync-with-uv~=0.6.0",
  "uv~=0.13.6",
  "zizmor~=1.31.1",
]

[tool.uv]
required-version = ">=0.11"

[tool.ruff]
required-version = ">=0.16"
line-length = 99
format.docstring-code-line-length = 99
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Trailing comma missing
  "CPY001", # Missing copyright notice at top of file
  "D203",   # Use a blank line to separate the docstring from the class definition
  "D212",   # Multi-line docstring summary should start at the first line
]
lint.per-file-ignores."src/dbeaver_portable/cli.py" = [
  "T201", # The CLI talks to its user through print().
]
lint.per-file-ignores."tests/**/*.py" = [
  "ANN401",  # Dynamically typed expressions (Any) are fine in test helpers/fixtures.
  "D205",    # Allow multi-line docstring summaries in descriptive test docstrings.
  "FBT001",  # Boolean positional values are normal in parametrized test cases.
  "PLR2004", # Magic values are OK in tests
  "S101",    # assert is a first class citizen in pytest tests
  "SLF001",  # Tests legitimately probe private members to assert internal state.
]
lint.mccabe.max-complexity = 12  # default 10  # C901
lint.pylint.max-args = 10  # default 5  # PLR0913

[tool.pylint]
messages_control.disable = [
  "broad-exception-caught",     # W0718 — governed by ruff BLE001.
  "import-error",               # E0401 — governed by mypy and ty.
  "import-outside-toplevel",    # C0415 — governed by ruff PLC0415.
  "invalid-name",               # C0103 — governed by ruff N*.
  "line-too-long",              # C0301 — governed by ruff E501.
  "missing-function-docstring", # C0116 — governed by ruff D103.
  "no-member",                  # E1101 — governed by mypy and ty.
  "no-name-in-module",          # E0611 — governed by mypy and ty.
  "protected-access",           # W0212 — governed by ruff SLF001 (enforced in non-test code).
  "redefined-builtin",          # W0622 — governed by ruff A001/A002/A004.
  "too-few-public-methods",     # R0903 — I just don't care about this one.
  "too-many-arguments",         # R0913 — governed by ruff (lint.pylint.max-args).
  "unused-argument",            # W0613 — governed by ruff ARG001/ARG002.
  "wrong-import-order",         # C0411 — governed by ruff I001.
  "wrong-import-position",      # C0413 — governed by ruff E402.
]
format.max-module-lines = 1500  # default 1000 # C0302
design.max-attributes = 10  # default 7  # R0902 (dataclasses mirroring Maven's model)
design.max-locals = 18  # default 15 # R0914
design.max-positional-arguments = 8  # default 5  # R0917
ignore-paths = [
  ".*/__pycache__/.*",
  "^[.].*/.*",         # Can't use \. because pylint reads backslashes as folder separators
  "^build/.*",
  "^dist/.*",
]
# Parallel jobs pickle the linter with dill, which still reads code.co_lnotab (removed in Python 3.15).
jobs = 1

[tool.deptry]
known_first_party = [ "dbeaver_portable" ]  # src layout: deptry cannot infer it

[tool.mypy]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
extra_checks = true
strict_equality = true
strict_equality_for_none = true
show_error_context = true
show_column_numbers = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.ty]
analysis.respect-type-ignore-comments = false

[tool.pytest]
addopts = [
  "-v",
  "--cov=dbeaver_portable",
  "--cov-report=html",
]
markers = [
  "windows: needs Windows PowerShell 5.1 (self-skipping elsewhere)",
]
minversion = "9.0"
norecursedirs = [
  ".*",
  "__pycache__",
  "build",
  "dist",
]
python_files = [
  "test_*.py",
]
strict = true
testpaths = [
  "tests",
]

[tool.coverage]
run.source = [ "dbeaver_portable" ]
run.omit = [
  "*tests*",
  ".venv/*",
]
run.branch = true
run.relative_files = true
report.exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.show_missing = true
report.ignore_errors = true
